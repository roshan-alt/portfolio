services:
  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/portfolio.db
      UPLOADS_DIR: /app/data/uploads
    volumes:
      - portfolio-data:/app/data
      - ./data:/app/seed:ro
    expose:
      - "8000"

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  portfolio-data:
