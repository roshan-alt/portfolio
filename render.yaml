# Render Blueprint — https://render.com/docs/blueprint-spec
# After deploy: set APP_ORIGINS to your GitHub Pages URL in the Render dashboard.

databases:
  - name: portfolio-db
    plan: free
    databaseName: portfolio
    user: portfolio

services:
  - type: web
    name: portfolio-api
    runtime: python
    plan: free
    rootDir: apps/api
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: IMPORT_SEED_ON_STARTUP
        value: "true"
      - key: APP_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: UPLOADS_DIR
        value: uploads
